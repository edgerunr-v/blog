services:
  web:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-https://blog.edgerunr-v.com}
        PUBLIC_SITE_LANGUAGE: ${PUBLIC_SITE_LANGUAGE:-}
    image: edgerunr-blog:latest
    container_name: edgerunr-blog
    restart: unless-stopped
    ports:
      - "${BLOG_PORT:-5123}:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
