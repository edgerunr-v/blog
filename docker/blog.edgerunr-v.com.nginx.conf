server {
    listen 80;
    listen [::]:80;
    server_name blog.edgerunr-v.com;
    include /www/server/nginx/conf/kanade-cloudflare-realip.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/edgerunr-blog-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        if ($http_x_forwarded_proto != "https") {
            return 308 https://blog.edgerunr-v.com$request_uri;
        }
        proxy_pass http://127.0.0.1:5123;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/articles/?$ {
        return 308 https://blog.edgerunr-v.com/posts/$is_args$args;
    }
    location ~ ^/comments/?$ {
        return 308 https://blog.edgerunr-v.com/messages/$is_args$args;
    }
    location ~ ^/(about|friends|messages|posts(?:/[^/]+)?)$ {
        return 308 https://blog.edgerunr-v.com$uri/$is_args$args;
    }

    access_log /www/wwwlogs/blog.edgerunr-v.com.access.log;
    error_log /www/wwwlogs/blog.edgerunr-v.com.error.log;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name blog.edgerunr-v.com;
    include /www/server/nginx/conf/kanade-cloudflare-realip.conf;

    ssl_certificate /etc/letsencrypt/live/blog.edgerunr-v.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.edgerunr-v.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KanadeSSL:10m;
    ssl_session_timeout 1d;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/edgerunr-blog-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:5123;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/articles/?$ {
        return 308 https://blog.edgerunr-v.com/posts/$is_args$args;
    }
    location ~ ^/comments/?$ {
        return 308 https://blog.edgerunr-v.com/messages/$is_args$args;
    }
    location ~ ^/(about|friends|messages|posts(?:/[^/]+)?)$ {
        return 308 https://blog.edgerunr-v.com$uri/$is_args$args;
    }

    access_log /www/wwwlogs/blog.edgerunr-v.com.access.log;
    error_log /www/wwwlogs/blog.edgerunr-v.com.error.log;
}
